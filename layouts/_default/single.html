{{ define "main" }}
<main>
    <article class="post">
        <header>
            <h1>{{ .Title }}</h1>
            <div class="post-meta">
                {{ .Date.Format "January 2, 2006" }}
                {{ with .Params.tags }}
                <div class="post-tags">
                    {{ range . }}<a href="/tags/{{ . | urlize }}/">#{{ . }}</a>{{ end }}
                </div>
                {{ end }}
                {{ with .Params.categories }}
                <div class="post-tags">
                    {{ range . }}<a href="/categories/{{ . | urlize }}/">{{ . }}</a>{{ end }}
                </div>
                {{ end }}
            </div>
        </header>
        <div class="content">
            {{ .Content }}
        </div>
    </article>
</main>
{{ end }}
