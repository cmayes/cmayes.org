{{ define "main" }}
<main>
    <h1>{{ .Title }}</h1>
    <ul class="post-list">
    {{ range .Data.Terms.Alphabetical }}
        <li>
            <a href="{{ .Page.Permalink }}">{{ .Page.Title }}</a>
            <span class="post-date">({{ .Count }})</span>
        </li>
    {{ end }}
    </ul>
</main>
{{ end }}
