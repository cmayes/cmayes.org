{{ define "main" }}
<main>
    <h1>{{ .Title }}</h1>
    <ul class="post-list">
    {{ range .Pages }}
        <li>
            <div>
                <a href="{{ .Permalink }}">{{ .Title }}</a>
                <span class="post-date"> &mdash; {{ .Date.Format "January 2, 2006" }}</span>
            </div>
            {{ with .Summary }}<p>{{ . }}</p>{{ end }}
        </li>
    {{ end }}
    </ul>
</main>
{{ end }}
